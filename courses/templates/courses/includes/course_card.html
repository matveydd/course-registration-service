<article class="card course-card mb-3">
    <div class="card-body">
        <h2 class="card-title h4">
            {{ course.title|default:"Без названия" }}
        </h2>

        <p class="card-text">
            Начало: {{ course.start_date }}
        </p>
        <p class="card-text">
            Свободно мест: {{ free }} из {{ course.capacity }}
        </p>

        <a
            href="{% url 'courses:detail' course.id %}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
